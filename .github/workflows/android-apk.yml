name: Construire APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copier HTML
        run: |
          mkdir -p app/src/main/assets/etape1 app/src/main/assets/etape2
          cp etape1/index.html app/src/main/assets/etape1/index.html
          cp etape2/index.html app/src/main/assets/etape2/index.html
      - name: Compiler APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Releve-Immo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
