<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relevé Immo — Étape 2</title><style>body{font-family:system-ui;background:#f3f6fa;color:#142338;margin:0;padding:20px}main{max-width:700px;margin:auto}section{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #0001}button{border:0;background:#124a85;color:white;border-radius:10px;padding:12px;margin:4px;cursor:pointer}button:disabled{opacity:.45}textarea{width:100%;min-height:140px;box-sizing:border-box;padding:12px;font:inherit}input{font:inherit;padding:8px;width:100%;box-sizing:border-box}.muted{color:#667}.room{border-bottom:1px solid #ddd;padding:10px 0}.room label{display:block;margin:8px 0 3px}.delete-component{display:block;margin:8px auto 4px;background:#c62828;color:white}.delete-component:hover{background:#a91e1e}</style></head><body><main><h1>🏠 Relevé Immo</h1><p>Étape 2 — Description des composants</p><section><button id="backstep">← Étape 1</button><p id="roomstatus" class="muted"></p><h2>Dictée des composants</h2><button id="mic2">🎙️ Démarrer la dictée</button><button id="stop2" disabled>■ Arrêter</button><textarea id="speech2" placeholder="Dans le salon, les murs A B C D en plâtre peinture…"></textarea><button id="parse2">Analyser les composants dictés</button><p id="parse2status" class="muted"></p></section><section><h2>Composants à vérifier</h2><button id="addcomponent">+ Ajouter un composant</button><div id="components"></div><button id="exportstep2">Exporter Table_General_Desciption_Pieces.xml</button><button id="exporttxt2">Exporter la dictée et les composants (.txt)</button><p id="step2status" class="muted"></p></section></main><script>
const $=id=>document.getElementById(id);
let rooms=[],keys=[],step2Items=[];
try{const payload=JSON.parse(decodeURIComponent(location.hash.slice(1)));if(!Array.isArray(payload.rooms)||!payload.rooms.length)throw Error('Pièces absentes');rooms=payload.rooms;keys=payload.keys||[];$('roomstatus').textContent=rooms.length+' pièces reçues depuis l’étape 1.';}catch(e){$('roomstatus').textContent='Aucune liste de pièces reçue. Retourne à l’étape 1 et utilise « Passer à l’étape 2 ».';$('parse2').disabled=true;$('exportstep2').disabled=true;}
$('backstep').onclick=()=>location.href='../etape1/index.html';
function newKey(i){const d=new Date(),p=[d.getFullYear(),d.getMonth()+1,d.getDate(),d.getHours(),d.getMinutes(),d.getSeconds()].map((x,j)=>String(x).padStart(j?2:4,'0'));return p.join('_')+'_'+String(Math.floor(Math.random()*1e15)).padStart(15,'0')+'_'+i}
const step2Fields=['id_classement_champs','CelfComposant','Localistion','Informations','Type','CREP_degaradtion','CREP_degaradtion_Details','CREP_mesure','Data_1','Data_2','Data_3','Data_4'];
function step2Blank(){const r={};for(const k of step2Fields)r[k]='';r.id_classement_champs=String(step2Items.length).padStart(5,'0');r.CelfComposant=newKey(step2Items.length);return r}
function drawStep2(){const root=$('components');root.replaceChildren();step2Items.forEach((r,i)=>{const card=document.createElement('div');card.className='room';const title=document.createElement('strong');title.textContent='Composant '+(i+1);card.append(title);for(const [field,label] of [['Localistion','Localisation (niveau - pièce)'],['Type','Type (Sol, Mur - A, Plafond…)'],['Informations','Informations (substrat, revêtement…)']]){const l=document.createElement('label');l.textContent=label;const input=document.createElement('input');input.value=r[field]||'';input.oninput=()=>r[field]=input.value;card.append(l,input)}const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Autres champs Liciel';details.append(summary);for(const field of step2Fields.filter(x=>!['Localistion','Type','Informations'].includes(x))){const l=document.createElement('label');l.textContent=field;const input=document.createElement('input');input.value=r[field]||'';input.oninput=()=>r[field]=input.value;details.append(l,input)}card.append(details);const del=document.createElement('button');del.textContent='Supprimer ce composant';del.className='delete-component';del.onclick=()=>{step2Items.splice(i,1);drawStep2()};card.append(del);root.append(card)})}
$('addcomponent').onclick=()=>{step2Items.push(step2Blank());drawStep2()};

// Analyse locale conservatrice : une ligne par composant, sans inventer de mesures CREP.
function norm2(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’]/g,"'")}
function componentsFromDictation(raw){
  const segments=raw.replace(/\s+/g,' ').split(/(?<=[.!?;])\s+|\s*,\s*(?=(?:le |la |les |un |une |dans |au |aux |du |des ))/i).filter(Boolean);
  const out=[], warnings=[];let place='',floor='';
  const places=['salon avec cuisine','salon cuisine','salle de bain','salle de jeu','chambre','placard','wc','toilettes','plenum','cave','garage','buanderie','cuisine','salon'];
  const knownRooms=rooms.map(r=>({name:r.name,floor:r.floor}));
  function add(type,info){if(!place){warnings.push('Localisation manquante pour '+type);return}const r=step2Blank();r.Localistion=(floor?floor+' - ':'')+place;r.Type=type;r.Informations=info;out.push(r)}
  function infoFor(t){const n=norm2(t);let substrate='',coat='';
    const substrateMatch=n.match(/(?:substrat\s*:\s*)?(placoplatre|placo|platre|plate|beton|parquet|carrelage|bois|pvc|metal|pierre)/);
    if(substrateMatch){substrate=({'placo':'placoplâtre','placoplatre':'placoplâtre','plate':'Plâtre','platre':'Plâtre','beton':'Béton','bois':'Bois','metal':'Métal','pierre':'Pierre','parquet':'Parquet','carrelage':'Carrelage','pvc':'PVC'})[substrateMatch[1]]||substrateMatch[1]}
    const yr=n.match(/(?:superieur a|apres|>\s*)(1949|1940|49|40)/);if(yr&&substrate){substrate+=' >'+(yr[1]==='49'?'1949':yr[1]==='40'?'1940':yr[1]);if(yr[1]==='1940'||yr[1]==='40')warnings.push('Année 1940 à vérifier : '+t.slice(0,65))}
    if(/peinture/.test(n))coat='Peinture';else if(/revetement\s*:\s*carrelage|carrelage\s+(?:du|sur)\s+mur/.test(n))coat='Carrelage';
    else if(/carrelage/.test(n)&&substrate!=='Carrelage')coat='Carrelage';
    if(/parquet/.test(n)&&substrate!=='Parquet'&&!coat)coat='Parquet';
    return [substrate?'Substrat : '+substrate:'',coat?'Revêtement : '+coat:''].filter(Boolean).join(' - ')
  }
  function letters(text){const n=norm2(text).replace(/\b([a-j])\s*,\s*(?=[a-j]\b)/g,'$1 ');const compact=n.match(/\b([a-j]{2,10})\b/);if(compact)return [...compact[1].toUpperCase()];const m=n.match(/\b(?:murs?|alle?ges?|embrasures?)\s+(?:a|en|de|du|avec|a\s+)?\s*((?:[a-j]\s*[, ]\s*){2,10})\b/);if(m)return [...m[1].matchAll(/[a-j]/g)].map(x=>x[0].toUpperCase());return []}
  // Découper également aux transitions explicites de composants, sans découper les listes de lettres.
  const clauses=segments.flatMap(t=>t.split(/\s+(?=(?:les?\s+(?:murs?|plafonds?|plinthes?|plaintes?|fen[eê]tres?|volets?|portes?|sols?|embrasures?|all[eè]ges?|aleges?|grilles?|poutres?)|l['’]?(?:embrasure|all[eè]ge)|la\s+(?:fen[eê]tre|porte|grille|cave)|dans\s+(?:le|la))\b)/i)).filter(Boolean);
  for(let t of clauses){const n=norm2(t);
    const at=n.match(/(?:dans\s+(?:le|la|les)|\b(?:le|la)\s+)(salon avec cuisine|salon cuisine|salle de bain|salle de jeu|chambre|placard|wc|toilettes|plenum|cave|garage|buanderie|cuisine|salon)\b/);
    if(at){place=at[1]==='toilettes'?'WC':at[1]==='plenum'?'Plénum':at[1]==='wc'?'WC':at[1].replace(/^./,c=>c.toUpperCase());const match=knownRooms.find(r=>norm2(r.name)===norm2(place));floor=match?.floor||floor;}
    if(!place)continue;
    const info=infoFor(t);
    const wall=n.match(/\bmurs?\b/);
    if(wall){const ls=letters(t);if(ls.length){for(const l of [...new Set(ls)])add('Mur - '+l,info)}else warnings.push('Mur(s) sans lettre certaine : '+t.slice(0,75));continue}
    const special=n.match(/\b(embrasure|allege|alle?ge)\b/);
    if(special){const ls=letters(t);const kind=special[1]==='embrasure'?'Embrasure fenêtre':'Allège fenêtre';if(ls.length)for(const l of [...new Set(ls)])add(kind+' - '+l,info);else warnings.push(kind+' : lettre non reconnue');continue}
    if(/\b(plinthes?|plaintes?)\b/.test(n)){add('Plinthes',info);continue}
    if(/\bplafond\b/.test(n)){add('Plafond',info);continue}
    if(/\bsol\b/.test(n)){add('Sol',info);continue}
    if(/\bpoutres?\b/.test(n)){add('Poutres',info);continue}
    for(const [re,kind] of [[/\bfenetre\b/,'Fenêtre'],[/\bvolet\b/,'Volet'],[/\bgrille\b/,'Grilles'],[/\bporte\b/,'Porte']]){
      if(re.test(n)){const letter=n.match(/\b(?:en|sur|de|fenetre|volet|grille|porte)\s+([a-j])\b/);const nums=[...n.matchAll(/\b(?:fenetre|volet)\s*(\d+)\b/g)].map(x=>x[1]);if(nums.length){for(const no of [...new Set(nums)])add(kind+' '+no+(letter?' - '+letter[1].toUpperCase():''),info)}else add(kind+(letter?' - '+letter[1].toUpperCase():''),info);break}
    }
  }
  return {items:out,warnings};
}
$('parse2').onclick=()=>{const raw=$('speech2').value.trim();if(!raw){$('parse2status').textContent='Dicte ou saisis les composants.';return}const result=componentsFromDictation(raw);if(!result.items.length){$('parse2status').textContent='Aucun composant reconnu. Vérifie la dictée.';return}step2Items.push(...result.items);step2Items.forEach((r,i)=>r.id_classement_champs=String(i).padStart(5,'0'));drawStep2();$('parse2status').textContent=result.items.length+' composants ajoutés. '+(result.warnings.length?'À vérifier : '+result.warnings.slice(0,8).join(' ; '):'Vérifie chaque ligne avant export.');};

function encode1252(s){const map={'€':128,'‚':130,'ƒ':131,'„':132,'…':133,'†':134,'‡':135,'ˆ':136,'‰':137,'Š':138,'‹':139,'Œ':140,'Ž':142,'‘':145,'’':146,'“':147,'”':148,'•':149,'–':150,'—':151,'˜':152,'™':153,'š':154,'›':155,'œ':156,'ž':158,'Ÿ':159};const arr=[];for(const c of s){const n=c.codePointAt(0);if(n<=127||(n>=160&&n<=255))arr.push(n);else if(map[c]!==undefined)arr.push(map[c]);else{const ent='&#'+n+';';for(const x of ent)arr.push(x.charCodeAt(0))}}return new Uint8Array(arr)}
function download(content,name,type,encoding='utf8'){const bytes=encoding==='cp1252'?encode1252(content):new TextEncoder().encode(content);if(window.AndroidFiles&&typeof window.AndroidFiles.save==='function'){let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));window.AndroidFiles.save(name,type,btoa(binary));return}const u=URL.createObjectURL(new Blob([bytes],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function xmlEscape(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function exportStep2(){if(!step2Items.length){alert('Ajoute au moins un composant.');return}const xml='<LiTable_General_Desciption_Pieces>\r'+step2Items.map((r,i)=>'     <LiItem_table_General_Desciption_Pieces>\r'+step2Fields.map(k=>'          <LiColonne_'+k+'>'+xmlEscape(r[k]||'')+'</LiColonne_'+k+'>').join('\r')+'\r     </LiItem_table_General_Desciption_Pieces>').join('\r')+'\r</LiTable_General_Desciption_Pieces>\r';download(xml,'Table_General_Desciption_Pieces.xml','application/xml','cp1252')}
$('exportstep2').onclick=exportStep2;

function exportTxtStep2(){
  const transcript=$('speech2').value.trim();
  if(!transcript&&!step2Items.length){
    $('step2status').textContent='Aucune dictée ni aucun composant à exporter.';
    return;
  }
  const lines=[
    'RELEVÉ IMMO — ÉTAPE 2',
    'Description des composants',
    '',
    'DICTÉE ORIGINALE',
    '----------------',
    transcript||'(Aucune dictée saisie)',
    '',
    'COMPOSANTS RECONNUS / CORRIGÉS',
    '------------------------------'
  ];
  if(!step2Items.length)lines.push('(Aucun composant analysé)');
  step2Items.forEach((r,i)=>{
    lines.push('', 'Composant '+(i+1),
      'Localisation : '+(r.Localistion||''),
      'Type : '+(r.Type||''),
      'Informations : '+(r.Informations||''));
    for(const key of step2Fields.filter(k=>!['Localistion','Type','Informations'].includes(k))){
      if(r[key])lines.push(key+' : '+r[key]);
    }
  });
  download(lines.join('\r\n')+'\r\n','ReleveImmo_Etape2_Dictee_et_Composants.txt','text/plain; charset=utf-8');
  $('step2status').textContent='Export TXT demandé : choisis où enregistrer le fichier.';
}
$('exporttxt2').onclick=exportTxtStep2;


let active=false,rec;const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
window.releveNativeSpeechResult=(text,status)=>{if(text)$('speech2').value+=text+' ';$('parse2status').textContent=status||'Dictée en cours';};
window.releveNativeSpeechPartial=()=>{};
window.releveNativeSpeechState=(on,status)=>{active=!!on;$('mic2').disabled=!!on;$('stop2').disabled=!on;$('parse2status').textContent=status||'';};
if(window.AndroidSpeech?.start){$('mic2').onclick=()=>window.AndroidSpeech.start();$('stop2').onclick=()=>window.AndroidSpeech.stop();}
else if(Speech){$('mic2').onclick=()=>{active=true;window.releveNativeSpeechState(true,'Écoute en cours…');function begin(){if(!active)return;rec=new Speech();rec.lang='fr-FR';rec.continuous=true;rec.interimResults=false;rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)window.releveNativeSpeechResult(e.results[i][0].transcript)};rec.onend=()=>{if(active)setTimeout(begin,300)};rec.start()}begin()};$('stop2').onclick=()=>{active=false;rec?.stop();window.releveNativeSpeechState(false,'Dictée arrêtée')}}else{$('mic2').disabled=true;$('parse2status').textContent='Dictée vocale indisponible. Saisie manuelle possible.'}
</script></body></html>
